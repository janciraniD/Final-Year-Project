{% extends "base.html" %}
{% block title %}Register – HealthChain AI{% endblock %}
{% block public_content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-4">
      <div class="text-center mb-4">
        <i class="fas fa-user-plus fa-3x text-success"></i>
        <h4 class="mt-3 fw-bold">Create Account</h4>
        <p class="text-muted small">Register to access the Healthcare System</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required placeholder="Choose a username"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" required placeholder="your@email.com"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Min. 8 characters"/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Role</label>
          <select name="role" class="form-select" required>
            <option value="">Select role...</option>
            <option value="doctor">Doctor / Healthcare Provider</option>
            <option value="patient">Patient</option>
          </select>
        </div>
        <button class="btn btn-success btn-lg w-100">
          <i class="fas fa-user-check me-2"></i>Register
        </button>
      </form>
      <div class="text-center mt-3">
        <small>Already have an account? <a href="{{ url_for('login') }}">Login here</a></small>
      </div>
    </div>
    <div class="card mt-3 p-3 text-center">
      <small class="text-muted">
        <i class="fas fa-cube me-1"></i>
        Registration is recorded on Ethereum Blockchain for immutability
      </small>
    </div>
  </div>
</div>
{% endblock %}
