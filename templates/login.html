{% extends "base.html" %}
{% block title %}Login – HealthChain AI{% endblock %}
{% block public_content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <div class="text-center mb-4">
        <i class="fas fa-shield-alt fa-3x text-primary"></i>
        <h4 class="mt-3 fw-bold">Secure Login</h4>
        <p class="text-muted small">HealthChain AI – Healthcare System</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control form-control-lg" required placeholder="Enter username"/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" required placeholder="Enter password"/>
        </div>
        <button class="btn btn-primary btn-lg w-100">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
      </form>
      <div class="text-center mt-3">
        <small>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></small>
      </div>
    </div>
    <div class="card mt-3 p-3 text-center">
      <small class="text-muted">
        <i class="fas fa-lock me-1"></i>
        Protected by Ethereum Blockchain + CryptoChaos Encryption
      </small>
    </div>
  </div>
</div>
{% endblock %}
